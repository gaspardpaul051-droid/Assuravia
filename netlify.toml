[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.13"
  # URL et clé anon Supabase sont publiques par nature (écrites dans /espace/config.js) : ne pas bloquer le build
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

# Pages publicitaires : jamais indexées par Google
[[headers]]
  for = "/lp/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Espace conseillers : privé, jamais indexé
[[headers]]
  for = "/espace/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Anciennes adresses du site garantie de loyer (pubs Google et liens existants)
[[redirects]]
  from = "/demande"
  to = "/particuliers/"
  status = 301
  force = true

# Ancienne page du blog
[[redirects]]
  from = "/blog.html"
  to = "/blog/"
  status = 301
  force = true

# Ancien simulateur (URL encore connue de Google)
[[redirects]]
  from = "/simulateur.html"
  to = "/particuliers/"
  status = 301
  force = true

[[redirects]]
  from = "/guide/*"
  to = "/blog/:splat"
  status = 301

[[redirects]]
  from = "/particuliers/rc-menage/*"
  to = "/particuliers/assurance-menage/"
  status = 301
  force = true

# Drapeaux : fichiers qui ne changent pas, mis en cache longtemps (téléphone : moins de téléchargements)
[[headers]]
  for = "/drapeaux/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Produits retirés le 11 novembre 2026 : redirection vers la page la plus proche (évite les erreurs 404)
[[redirects]]
  from = "/particuliers/garantie-de-loyer/*"
  to = "/particuliers/assurance-menage/"
  status = 301
  force = true

[[redirects]]
  from = "/particuliers/placements/*"
  to = "/particuliers/3e-pilier/"
  status = 301
  force = true

[[redirects]]
  from = "/particuliers/declaration-impots/*"
  to = "/particuliers/3e-pilier/"
  status = 301
  force = true

[[redirects]]
  from = "/particuliers/comparateur-hypothecaire/*"
  to = "/particuliers/assurance-batiment/"
  status = 301
  force = true

[[redirects]]
  from = "/particuliers/hypotheque/*"
  to = "/particuliers/assurance-batiment/"
  status = 301
  force = true

[[redirects]]
  from = "/entreprises/techniques/*"
  to = "/entreprises/commerce-inventaire/"
  status = 301
  force = true

[[redirects]]
  from = "/entreprises/transport/*"
  to = "/entreprises/vehicules-entreprise/"
  status = 301
  force = true

