[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.13"

# Pages publicitaires : jamais indexées par Google
[[headers]]
  for = "/lp/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Espace conseillers : privé, jamais indexé
[[headers]]
  for = "/espace/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Anciennes adresses du site garantie de loyer (pubs Google et liens existants)
[[redirects]]
  from = "/demande"
  to = "/particuliers/garantie-de-loyer/"
  status = 301
  force = true

[[redirects]]
  from = "/guide/*"
  to = "/blog/:splat"
  status = 301

[[redirects]]
  from = "/particuliers/rc-menage/*"
  to = "/particuliers/assurance-menage/"
  status = 301
  force = true

# Drapeaux : fichiers qui ne changent pas, mis en cache longtemps (téléphone : moins de téléchargements)
[[headers]]
  for = "/drapeaux/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
