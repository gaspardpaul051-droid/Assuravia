{# Catalogue filtrable. Attend `groupe` ("particuliers" ou "entreprises"). #}
{% import "partials/icones.html" as i %}
{% set g = groupes[groupe] %}
<div class="catalogue" data-catalogue>
  <div class="filtres" role="group" aria-label="Filtrer par catégorie">
    <button type="button" class="filtre" aria-pressed="true" data-filtre="">Toutes les assurances</button>
    {% for c in g.categories %}
    <button type="button" class="filtre" aria-pressed="false" data-filtre="{{ c }}">{{ c }}</button>
    {% endfor %}
  </div>
  <div class="cartes">
    {% for p in produits[groupe] %}{% include "partials/carte-produit.html" %}{% endfor %}
  </div>
  <p class="catalogue__statut" aria-live="polite" data-catalogue-statut></p>
</div>
