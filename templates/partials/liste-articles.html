<ul class="cartes-articles">
  {% for a in liste %}
  <li>
    <a class="carte-article" href="{{ a.url }}">
      <span class="badge">{{ a.categorie }}</span>
      <span class="carte-article__titre">{{ a.titre }}</span>
      <span class="carte-article__desc">{{ a.description }}</span>
      <span class="carte-article__date">{{ a.date_fr }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
